<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body{
            padding-top:90px;
            background-color:#f8f9fa;
        }

        .college-logo{
            height:60px;
        }

        .college-title{
            font-size:1.5rem;
            font-weight:bold;
        }

        .dashboard-card{
            transition:0.3s;
        }

        .dashboard-card:hover{
            transform:translateY(-5px);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-light shadow-sm fixed-top">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">
            <img src="cvrlogo.png" alt="logo" class="college-logo">
        </a>

        <span class="mx-auto college-title">
            Student Management Portal
        </span>

        <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>

                <li class="nav-item">
                    <a href="registration.html" class="nav-link">
                        Registration
                    </a>
                </li>

                <li class="nav-item">
                    <a href="contact.html" class="nav-link">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- Dashboard -->

<div class="container">

    <h1 class="text-center mb-5">
        Student Dashboard
    </h1>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card text-center shadow dashboard-card">
                <div class="card-body">
                    <h2>250</h2>
                    <p>Total Students</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow dashboard-card">
                <div class="card-body">
                    <h2>15</h2>
                    <p>Courses</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow dashboard-card">
                <div class="card-body">
                    <h2>92%</h2>
                    <p>Attendance</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow dashboard-card">
                <div class="card-body">
                    <h2>85%</h2>
                    <p>Results</p>
                </div>
            </div>
        </div>

    </div>

    <div class="card mt-5 shadow">

        <div class="card-header bg-primary text-white">
            Recent Student Records
        </div>

        <div class="card-body">

            <table class="table table-striped table-hover">

                <thead>

                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>Attendance</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>101</td>
                        <td>Rohan</td>
                        <td>DS</td>
                        <td>92%</td>
                    </tr>

                    <tr>
                        <td>102</td>
                        <td>Rahul</td>
                        <td>CSE</td>
                        <td>88%</td>
                    </tr>

                    <tr>
                        <td>103</td>
                        <td>Priya</td>
                        <td>AIML</td>
                        <td>95%</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
