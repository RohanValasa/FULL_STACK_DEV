<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">

    <h1 class="text-center mb-5">
        Student Dashboard
    </h1>

    <!-- Statistics Cards -->
    <div class="row g-4 mb-5">

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Total Students</h5>
                    <span class="badge bg-primary fs-5">500</span>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Present Students</h5>
                    <span class="badge bg-success fs-5">450</span>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Absent Students</h5>
                    <span class="badge bg-danger fs-5">50</span>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Placements</h5>
                    <span class="badge bg-warning text-dark fs-5">120</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Search Box -->
    <div class="mb-4">
        <input type="text"
               class="form-control"
               placeholder="Search Student">
    </div>

    <!-- Responsive Table -->
    <div class="table-responsive">

        <table class="table table-bordered table-striped table-hover">

            <thead class="table-dark">

                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Attendance</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>101</td>
                    <td>Rohan</td>
                    <td>Data Science</td>
                    <td>
                        <span class="badge bg-success">
                            Present
                        </span>
                    </td>
                </tr>

                <tr>
                    <td>102</td>
                    <td>Pradeep</td>
                    <td>CSE</td>
                    <td>
                        <span class="badge bg-danger">
                            Absent
                        </span>
                    </td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Nithin</td>
                    <td>AIML</td>
                    <td>
                        <span class="badge bg-success">
                            Present
                        </span>
                    </td>
                </tr>

                <tr>
                    <td>104</td>
                    <td>Rushikesh</td>
                    <td>ECE</td>
                    <td>
                        <span class="badge bg-success">
                            Present
                        </span>
                    </td>
                </tr>

                <tr>
                    <td>105</td>
                    <td>Raju</td>
                    <td>EEE</td>
                    <td>
                        <span class="badge bg-danger">
                            Absent
                        </span>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
