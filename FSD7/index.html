<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Transitions</title>
</head>
<body>
    <h1 align="center">CSS Transitions and Animations</h1>

    <div class="trans_div">
        <h3 align="center">Transitions</h3>
    <div class="div1">
    
    <p align="center">Ease in</p>
    </div>
    <div class="div2">
        <p align="center">Ease out</p>
    </div>
    <div class="div3">
        <p align="center">Ease in out</p>
    </div>
    <div class="div4">
        <p align="center">
            Width:ease-in
            height:ease-out
            bgcolor:ease
        </p>
    </div>

    </div>
    <div class="anime_div">
        <h3 align="center">Animations</h3>
        <div class="a1">
            <p align="center">color-change</p>

        </div>
        <div class="a2">
            <p align="center">fade-out</p>
        </div>
        <div class="a3">
            <p align="center">slide-up-down</p>
        </div>
        <div class="a4">
            <p align="center">rotation</p>
        </div>
        
    </div>   
    <div class="x-move">
        <div class="a5">
            <p align="center">steps</p>
        </div>
    </div> 
    
</body>
</html>
