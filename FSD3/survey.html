<!DOCTYPE html>
<html>
<head>
    <title>Survey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Society Survey</h1>
</header>

<div class="container">

    <div class="card">

        <form>

            <label>Cleanliness Satisfaction</label>
            <select>
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
            </select>

            <label>Parking Issue</label>
            <input type="checkbox"> Yes

            <br><br>

            <label>Water Supply Feedback</label>
            <textarea rows="4"></textarea>

            <label>Maintenance Quality</label>
            <input type="radio" name="rate"> Good
            <input type="radio" name="rate"> Bad

            <br><br>

            <label>Suggestions</label>
            <textarea rows="4"></textarea>

            <button>Submit Survey</button>

        </form>

    </div>

</div>

</body>
</html>
