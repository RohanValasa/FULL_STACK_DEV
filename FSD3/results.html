<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Election Results</h1>
</header>

<div class="container">

    <table>
        <tr>
            <th>Candidate</th>
            <th>Votes</th>
            <th>Percentage</th>
        </tr>

        <tr>
            <td>Rahul Sharma</td>
            <td>120</td>
            <td>60%</td>
        </tr>

        <tr>
            <td>Priya Reddy</td>
            <td>80</td>
            <td>40%</td>
        </tr>
    </table>

    <br>

    <div class="card">
        <p>Rahul Sharma</p>

        <div class="progress">
            <div class="progress-bar" style="width:60%"></div>
        </div>

        <br>

        <p>Priya Reddy</p>

        <div class="progress">
            <div class="progress-bar" style="width:40%"></div>
        </div>
    </div>

</div>

</body>
</html>
